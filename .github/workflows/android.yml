name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/nintendo-companion-design-system
          fetch-depth: 0
      - name: Finish persisted Journey hardening compaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt')
          s=p.read_text()
          marker='    var view by rememberSaveable(startInGames){mutableStateOf(if(!startInGames&&activeJourneyGame!=null)JourneyView.ROUTE else JourneyView.GAMES)}\n'
          if marker not in s: raise SystemExit('Expected Journey navigation marker not found')
          tail=s[s.index(marker)+len(marker):]
          if '\n\n' in tail:
              before,after=tail.split('\n\n',1)
              s=s[:s.index(marker)+len(marker)]+before+'\n'+after
              p.write_text(s)
          PY
      - name: Persist final Journey compaction
        run: |
          if ! git diff --quiet -- app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
            git diff --cached --check
            git commit -m 'fix(journey): satisfy hardening budget without behavior change'
            git push origin HEAD:feature/nintendo-companion-design-system
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Validate v20.12.1 Trainer Companion
        run: |
          grep -q 'versionCode = 21201' app/build.gradle.kts
          grep -q 'versionName = "20.12.1"' app/build.gradle.kts
          grep -q 'applicationId = "com.otaviobarreto.pokedex"' app/build.gradle.kts
          grep -q 'navigationBarsPadding()' app/src/main/java/com/otaviobarreto/pokedex/ui/PokedexChrome.kt
          grep -q 'DexStatusPane' app/src/main/java/com/otaviobarreto/pokedex/ui/ReferenceHubScreen.kt
      - name: Verify source architecture
        run: python3 scripts/verify_repo.py
      - name: Product hardening audit
        run: python3 scripts/audit_hardening.py
      - name: Accessibility audit
        run: python3 scripts/audit_accessibility.py
      - name: Device readiness audit
        run: python3 scripts/audit_device_readiness.py
      - name: Install artwork audit dependency
        run: python3 -m pip install Pillow
      - name: Second-pass artwork audit
        run: python3 scripts/audit_artwork.py
      - name: Upload artwork audit
        uses: actions/upload-artifact@v4
        with:
          name: artwork-second-pass-audit
          path: artwork-audit/
      - name: Journey visual asset audit
        run: python3 scripts/audit_journey_visuals.py
      - name: Journey boss Pokemon artwork audit
        run: python3 scripts/audit_journey_boss_pokemon.py
      - name: Full National Dex audit
        run: python3 scripts/audit_national_dex.py
      - name: National Forms audit
        run: python3 scripts/audit_national_forms.py
      - name: Problem Forms audit
        run: python3 scripts/audit_problem_forms.py
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POKEDEX-v20.12.1-Device-Test
          path: app/build/outputs/apk/debug/app-debug.apk
