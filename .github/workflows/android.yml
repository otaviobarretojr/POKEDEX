name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Validate v6.31.0 instant offline polish
        run: |
          sed -i 's/versionCode = [0-9]\+/versionCode = 6310/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "6.31.0"/' app/build.gradle.kts
      - name: Verify source architecture
        run: python3 scripts/verify_repo.py
      - name: Install artwork audit dependency
        run: python3 -m pip install Pillow
      - name: Second-pass artwork audit
        run: python3 scripts/audit_artwork.py
      - name: Upload artwork audit
        uses: actions/upload-artifact@v4
        with:
          name: artwork-second-pass-audit
          path: artwork-audit/
      - name: Journey visual asset audit
        run: python3 scripts/audit_journey_visuals.py
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
