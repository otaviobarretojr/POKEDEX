name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch and audit final Pikachu companion model
        run: python3 scripts/fetch_companion_model.py
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Validate v20.13.7 Static Rig Check
        run: |
          grep -q 'versionCode = 21307' app/build.gradle.kts
          grep -q 'versionName = "20.13.7"' app/build.gradle.kts
          grep -q 'applicationId = "com.otaviobarreto.pokedex"' app/build.gradle.kts
          grep -q 'navigationBarsPadding()' app/src/main/java/com/otaviobarreto/pokedex/ui/PokedexChrome.kt
          grep -q 'DexStatusPane' app/src/main/java/com/otaviobarreto/pokedex/ui/ReferenceHubScreen.kt
      - name: Verify source architecture
        run: python3 scripts/verify_repo.py
      - name: Product hardening audit
        run: python3 scripts/audit_hardening.py
      - name: Accessibility audit
        run: python3 scripts/audit_accessibility.py
      - name: Device readiness audit
        run: python3 scripts/audit_device_readiness.py
      - name: Install artwork audit dependency
        run: python3 -m pip install Pillow
      - name: Second-pass artwork audit
        run: python3 scripts/audit_artwork.py
      - name: Upload artwork audit
        uses: actions/upload-artifact@v7
        with:
          name: artwork-second-pass-audit
          path: artwork-audit/
      - name: Journey visual asset audit
        run: python3 scripts/audit_journey_visuals.py
      - name: Journey boss Pokemon artwork audit
        run: python3 scripts/audit_journey_boss_pokemon.py
      - name: Full National Dex audit
        run: python3 scripts/audit_national_dex.py
      - name: National Forms audit
        run: python3 scripts/audit_national_forms.py
      - name: Problem Forms audit
        run: python3 scripts/audit_problem_forms.py
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Compile app and instrumentation tests
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Stage stable smoke APKs
        run: |
          mkdir -p stable-smoke-apks
          cp app/build/outputs/apk/debug/app-debug.apk stable-smoke-apks/app.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk stable-smoke-apks/test.apk
      - name: Upload stable smoke APKs
        uses: actions/upload-artifact@v7
        with:
          name: stable-smoke-apks
          path: stable-smoke-apks/
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: POKEDEX-v20.13.7-Static-Rig-Check
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke:
    name: Android stable smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download smoke APKs
        uses: actions/download-artifact@v7
        with:
          name: stable-smoke-apks
          path: stable-smoke-apks
      - name: Run stable smoke tests on lightweight Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run_android_smoke.sh stable-smoke-apks/app.apk stable-smoke-apks/test.apk
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-reports
          path: stable-smoke-results/
          if-no-files-found: ignore
