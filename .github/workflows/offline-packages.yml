name: Build Offline CDN Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_offline_general_package.py"
      - ".github/workflows/offline-packages.yml"

permissions:
  contents: write

concurrency:
  group: offline-packages-v20
  cancel-in-progress: false

jobs:
  build-general:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package builder dependencies
        run: python -m pip install --upgrade requests urllib3

      - name: Build general offline package
        env:
          POKEDEX_PACKAGE_WORKERS: "12"
        run: python scripts/build_offline_general_package.py

      - name: Show package metadata
        run: cat dist/pokedex-general-v20.meta.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-general-v20
          path: |
            dist/pokedex-general-v20.zip
            dist/pokedex-general-v20.meta.json
          compression-level: 0
          retention-days: 30

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view offline-v20 >/dev/null 2>&1; then
            echo "Release offline-v20 already exists"
          else
            gh release create offline-v20 \
              --title "POKEDEX Offline Packages v20" \
              --notes "Pacotes offline versionados para download rápido pelo aplicativo."
          fi
          gh release upload offline-v20 \
            dist/pokedex-general-v20.zip \
            dist/pokedex-general-v20.meta.json \
            --clobber
