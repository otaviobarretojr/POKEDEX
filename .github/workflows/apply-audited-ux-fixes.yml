name: Apply audited UX fixes

on:
  push:
    branches:
      - feature/nintendo-companion-design-system

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/nintendo-companion-design-system
          fetch-depth: 0
      - name: Apply audited source fixes
        run: python3 scripts/apply_full_audit_fixes.py
      - name: Commit source fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt app/src/main/java/com/otaviobarreto/pokedex/ui/CollectionScreen.kt
          git commit -m "ux: refine Journey hierarchy and Shiny preview state"
          git push origin HEAD:feature/nintendo-companion-design-system
