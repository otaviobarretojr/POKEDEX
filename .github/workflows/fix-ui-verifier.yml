name: Fix UI verifier compatibility

on:
  push:
    branches: [ "feature/nintendo-companion-design-system" ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nintendo-companion-design-system
      - name: Restore verified current-objective label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt')
          text=p.read_text()
          old='                            "AGORA · "+(ui.chapter ?: JourneyTeamProgressCatalog.chapterFor(step.id)),'
          new='                            "OBJETIVO ATUAL · "+(ui.chapter ?: JourneyTeamProgressCatalog.chapterFor(step.id)),'
          if old not in text:
              raise SystemExit('current objective label not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Persist correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          git diff --cached --check
          git commit -m 'fix(journey): preserve verified current objective label'
          git push origin HEAD:feature/nintendo-companion-design-system
