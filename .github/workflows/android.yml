name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Validate v20.12.1 Trainer Companion
        run: |
          grep -q 'versionCode = 21201' app/build.gradle.kts
          grep -q 'versionName = "20.12.1"' app/build.gradle.kts
          grep -q 'applicationId = "com.otaviobarreto.pokedex"' app/build.gradle.kts
          grep -q 'navigationBarsPadding()' app/src/main/java/com/otaviobarreto/pokedex/ui/PokedexChrome.kt
          grep -q 'DexStatusPane' app/src/main/java/com/otaviobarreto/pokedex/ui/ReferenceHubScreen.kt
      - name: Verify source architecture
        run: python3 scripts/verify_repo.py
      - name: Product hardening audit
        run: python3 scripts/audit_hardening.py
      - name: Accessibility audit
        run: python3 scripts/audit_accessibility.py
      - name: Device readiness audit
        run: python3 scripts/audit_device_readiness.py
      - name: Install artwork audit dependency
        run: python3 -m pip install Pillow
      - name: Second-pass artwork audit
        run: python3 scripts/audit_artwork.py
      - name: Upload artwork audit
        uses: actions/upload-artifact@v4
        with:
          name: artwork-second-pass-audit
          path: artwork-audit/
      - name: Journey visual asset audit
        run: python3 scripts/audit_journey_visuals.py
      - name: Journey boss Pokemon artwork audit
        run: python3 scripts/audit_journey_boss_pokemon.py
      - name: Full National Dex audit
        run: python3 scripts/audit_national_dex.py
      - name: National Forms audit
        run: python3 scripts/audit_national_forms.py
      - name: Problem Forms audit
        run: python3 scripts/audit_problem_forms.py
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare instrumented UI app
        run: gradle assembleDebug assembleDebugAndroidTest

  device-tests:
    name: Instrumented UI — ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Compact Phone
            profile: pixel_2
            output: compact
            emulator_options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
            device_setup: ":"
          - label: Galaxy S25 Ultra
            profile: pixel_6
            output: large
            emulator_options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1440x3120"
            device_setup: "adb shell wm size 1440x3120 && adb shell wm density 480"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ${{ matrix.label }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: ${{ matrix.emulator_options }}
          disable-animations: true
          script: |
            ${{ matrix.device_setup }}
            gradle connectedDebugAndroidTest
            mkdir -p visual-regression/${{ matrix.output }}
            adb pull /sdcard/Download/pokedex-visual-regression/. visual-regression/${{ matrix.output }}/
      - name: Upload device visual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.output }}
          path: visual-regression/${{ matrix.output }}/
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.output }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/


  validate-and-package:
    name: Visual 8/8 + APK
    needs: device-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Download Compact visual
        uses: actions/download-artifact@v4
        with:
          name: visual-compact
          path: visual-regression/compact
      - name: Download S25 Ultra visual
        uses: actions/download-artifact@v4
        with:
          name: visual-large
          path: visual-regression/large
      - name: Install visual comparison dependency
        run: python3 -m pip install Pillow
      - name: Compare 8/8 against approved baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p visual-baseline
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10440859710/zip" \
            -o visual-baseline.zip
          unzip -q visual-baseline.zip -d visual-baseline
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import sys
          names=("journey.png","pokedex.png","collection.png","box.png")
          failed=[]
          for device in ("compact","large"):
              for name in names:
                  baseline=Path("visual-baseline")/device/name
                  current=Path("visual-regression")/device/name
                  if not baseline.exists() or not current.exists():
                      failed.append(f"{device}/{name}: arquivo ausente")
                      continue
                  with Image.open(baseline) as a, Image.open(current) as b:
                      a=a.convert("RGBA"); b=b.convert("RGBA")
                      if a.size != b.size:
                          failed.append(f"{device}/{name}: tamanho {b.size} != baseline {a.size}")
                          continue
                      if ImageChops.difference(a,b).getbbox() is not None:
                          failed.append(f"{device}/{name}: regressão pixel-perfect")
          if failed:
              print("\n".join("VISUAL FAIL: "+x for x in failed))
              sys.exit(1)
          print("Visual regression: 8/8 goldens pixel-perfect.")
          PY
      - name: Build debug APK
        run: gradle clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POKEDEX-v20.12.1-Trainer-Companion-Polish
          path: app/build/outputs/apk/debug/app-debug.apk
