name: Apply Journey home hierarchy polish

on:
  push:
    branches: [ "feature/nintendo-companion-design-system" ]
    paths: [ ".github/workflows/apply-journey-home-polish.yml" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nintendo-companion-design-system
          fetch-depth: 0
      - name: Polish Journey home hierarchy
        env:
          PATCH_B64: ''
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/journey_patch.py
          python3 /tmp/journey_patch.py
      - name: Validate Journey polish
        run: |
          grep -q 'CONTINUE SUA JORNADA' app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          grep -q 'Text("Continuar objetivo"' app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          grep -q 'FERRAMENTAS DA JORNADA' app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          grep -q 'DropdownMenuItem' app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          python3 scripts/verify_repo.py
          python3 scripts/audit_hardening.py
          git diff --check
          wc -l app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
      - name: Persist Journey polish
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          git commit -m 'design(journey): focus home on active adventure'
          git push origin HEAD:feature/nintendo-companion-design-system
