name: Patch Journey Direct Route

on:
  push:
    branches: [feature/nintendo-companion-design-system]
    paths: [.github/workflows/patch-journey-direct-route.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nintendo-companion-design-system
          fetch-depth: 0
      - name: Patch Journey navigation for every game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt')
          s = p.read_text()
          replacements = [
              (
                  '''    var selectedGame by rememberSaveable { mutableStateOf<String?>(null) }
    var view by rememberSaveable { mutableStateOf(JourneyView.GAMES) }''',
                  '''    val activeJourneyGame = remember(startInGames) {
        if(startInGames) null else AppStatePreferences.activeGame
            .takeIf { active -> AppGameCatalog.adventureGames.any { it.label == active } }
    }
    var selectedGame by rememberSaveable(startInGames) { mutableStateOf(activeJourneyGame) }
    var view by rememberSaveable(startInGames) {
        mutableStateOf(if(!startInGames && activeJourneyGame != null) JourneyView.ROUTE else JourneyView.GAMES)
    }''',
                  'initial active journey'
              ),
              (
                  '''                selectedGame=it
                view=JourneyView.GAME_MENU''',
                  '''                selectedGame=it
                view=if(startInGames) JourneyView.GAME_MENU else JourneyView.ROUTE''',
                  'selection'
              ),
              (
                  '''            JourneyView.ROUTE -> view=JourneyView.GAME_MENU''',
                  '''            JourneyView.ROUTE -> if(startInGames) view=JourneyView.GAME_MENU''',
                  'system back'
              ),
              (
                  '''            onBack={view=JourneyView.GAME_MENU},
            onTeam={onOpenTeamGuide(game.label,JourneySmartProgress.context(game.label).phase.name,null)},''',
                  '''            onBack={if(startInGames) view=JourneyView.GAME_MENU},
            onTeam={onOpenTeamGuide(game.label,JourneySmartProgress.context(game.label).phase.name,null)},''',
                  'route back'
              ),
          ]
          changed = False
          for old, new, label in replacements:
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f'Expected Journey pattern missing: {label}')
              s = s.replace(old, new, 1)
              changed = True
          if not changed:
              raise SystemExit('Journey navigation was already fully patched')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/otaviobarreto/pokedex/ui/JourneyScreen.kt
          git diff --cached --check
          git commit -m 'fix(journey): separate active journey from game library'
          git push origin HEAD:feature/nintendo-companion-design-system
