name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Validate v20.13.0 Stable Foundation
        run: |
          grep -q 'versionCode = 21300' app/build.gradle.kts
          grep -q 'versionName = "20.13.0"' app/build.gradle.kts
          grep -q 'applicationId = "com.otaviobarreto.pokedex"' app/build.gradle.kts
          grep -q 'navigationBarsPadding()' app/src/main/java/com/otaviobarreto/pokedex/ui/PokedexChrome.kt
          grep -q 'DexStatusPane' app/src/main/java/com/otaviobarreto/pokedex/ui/ReferenceHubScreen.kt
      - name: Verify source architecture
        run: python3 scripts/verify_repo.py
      - name: Product hardening audit
        run: python3 scripts/audit_hardening.py
      - name: Accessibility audit
        run: python3 scripts/audit_accessibility.py
      - name: Device readiness audit
        run: python3 scripts/audit_device_readiness.py
      - name: Install artwork audit dependency
        run: python3 -m pip install Pillow
      - name: Second-pass artwork audit
        run: python3 scripts/audit_artwork.py
      - name: Upload artwork audit
        uses: actions/upload-artifact@v7
        with:
          name: artwork-second-pass-audit
          path: artwork-audit/
      - name: Journey visual asset audit
        run: python3 scripts/audit_journey_visuals.py
      - name: Journey boss Pokemon artwork audit
        run: python3 scripts/audit_journey_boss_pokemon.py
      - name: Full National Dex audit
        run: python3 scripts/audit_national_dex.py
      - name: National Forms audit
        run: python3 scripts/audit_national_forms.py
      - name: Problem Forms audit
        run: python3 scripts/audit_problem_forms.py
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Compile instrumentation tests
        run: gradle assembleDebugAndroidTest
      - name: Run stable smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p app/build/outputs/stable-smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            set +e
            adb shell am instrument -w -r com.otaviobarreto.pokedex.test/androidx.test.runner.AndroidJUnitRunner > app/build/outputs/stable-smoke/instrumentation.txt 2>&1
            status=$?
            set -e
            cat app/build/outputs/stable-smoke/instrumentation.txt
            adb logcat -d -v threadtime > app/build/outputs/stable-smoke/emulator-logcat.txt || true
            test "$status" -eq 0
            grep -Eq '^OK \\([1-9][0-9]* tests?\\)      - name: Build debug APK
        run: gradle clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: POKEDEX-v20.13.0-Stable-Foundation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 app/build/outputs/stable-smoke/instrumentation.txt
            ! grep -Eq 'FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED' app/build/outputs/stable-smoke/instrumentation.txt
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-reports
          path: |
            app/build/outputs/stable-smoke/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Build debug APK
        run: gradle clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: POKEDEX-v20.13.0-Stable-Foundation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
