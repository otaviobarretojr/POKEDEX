name: Android Build

on:
  push:
    branches: [ "main", "feature/in-app-updater" ]
    paths-ignore:
      - "update.json"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: "21.1.0"
  RELEASE_CODE: "22100"
  RELEASE_ARTIFACT: "POKEDEX-v21.1.0-Release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android 17 preview SDK
        run: android sdk install --canary "platforms/android-37.0" "build-tools/37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Restore stable signing key
        run: |
          mkdir -p signing
          base64 -d ci/pokedex-release.jks.b64 > signing/pokedex-release.jks
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d ci/app_icon_256.webp.b64 > app/src/main/res/drawable/app_icon.webp
      - name: Apply release metadata
        run: python3 scripts/apply_release_version.py
      - name: Validate v21.1 Pokedex-only release
        run: |
          grep -q 'versionCode = 22100' app/build.gradle.kts
          grep -q 'versionName = "21.1.0"' app/build.gradle.kts
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'applicationId = "com.otaviobarreto.pokedex"' app/build.gradle.kts
          grep -q 'isDebuggable = false' app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
      - name: Verify Pokedex-only architecture
        run: python3 scripts/verify_pokedex_only.py
      - name: Product hardening audit
        run: python3 scripts/audit_hardening.py
      - name: Accessibility audit
        run: python3 scripts/audit_accessibility.py
      - name: Device readiness audit
        run: python3 scripts/audit_device_readiness.py
      - name: Install artwork audit dependency
        run: python3 -m pip install Pillow
      - name: Second-pass artwork audit
        run: python3 scripts/audit_artwork.py
      - name: Upload artwork audit
        uses: actions/upload-artifact@v7
        with:
          name: artwork-second-pass-audit
          path: artwork-audit/
      - name: Full National Dex audit
        run: python3 scripts/audit_national_dex.py
      - name: National Forms audit
        run: python3 scripts/audit_national_forms.py
      - name: Problem Forms audit
        run: python3 scripts/audit_problem_forms.py
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintRelease
      - name: Compile Macrobenchmark / Baseline Profile module
        run: gradle :baselineprofile:assemble
      - name: Download v21.0.0 debuggable upgrade baseline
        uses: actions/download-artifact@v7
        with:
          name: POKEDEX-v21.0.0-Pokedex-Only
          path: upgrade-apks
          repository: otaviobarretojr/POKEDEX
          run-id: 38056465174
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage v21.0.0 baseline
        run: mv upgrade-apks/app-debug.apk upgrade-apks/baseline.apk
      - name: Compile production, debug and instrumentation APKs
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Verify production update package and signature
        run: bash scripts/verify_update_contract.sh app/build/outputs/apk/release/app-release.apk upgrade-apks/baseline.apk
      - name: Stage stable smoke APKs
        run: |
          mkdir -p stable-smoke-apks
          cp app/build/outputs/apk/release/app-release.apk stable-smoke-apks/release.apk
          cp app/build/outputs/apk/debug/app-debug.apk stable-smoke-apks/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk stable-smoke-apks/test.apk
          cp upgrade-apks/baseline.apk stable-smoke-apks/baseline.apk
      - name: Upload stable smoke APKs
        uses: actions/upload-artifact@v7
        with:
          name: stable-smoke-apks
          path: stable-smoke-apks/
          if-no-files-found: error
      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: POKEDEX-v21.1.0-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  android-smoke:
    name: Android stable smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download smoke APKs
        uses: actions/download-artifact@v7
        with:
          name: stable-smoke-apks
          path: stable-smoke-apks
      - name: Run full smoke on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run_android_smoke.sh stable-smoke-apks/release.apk stable-smoke-apks/debug.apk stable-smoke-apks/test.apk stable-smoke-apks/baseline.apk
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-reports
          path: stable-smoke-results/
          if-no-files-found: ignore

  android-compat:
    name: Android compatibility API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            system_api: 26
            target: default
            channel: stable
          - api: 35
            system_api: 35
            target: default
            channel: stable
          - api: 37
            system_api: "37.0"
            target: google_apis
            channel: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download production APK
        uses: actions/download-artifact@v7
        with:
          name: POKEDEX-v21.1.0-Release
          path: release-apk
      - name: Launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.system_api }}
          system-image-api-level: ${{ matrix.system_api }}
          target: ${{ matrix.target }}
          channel: ${{ matrix.channel }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run_android_compat_smoke.sh release-apk/app-release.apk

  publish-update:
    name: Publish in-app update
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[manifest-only]')
    needs: [build, android-smoke, android-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download signed Release APK
        uses: actions/download-artifact@v7
        with:
          name: POKEDEX-v21.1.0-Release
          path: release-apk
      - name: Stage release files and manifest
        run: |
          mv release-apk/app-release.apk release-apk/pokedex.apk
          SHA256="$(sha256sum release-apk/pokedex.apk | awk '{print $1}')"
          cat > release-apk/update.json <<EOF
          {
            "versionCode": 22100,
            "versionName": "21.1.0",
            "apkUrl": "https://github.com/otaviobarretojr/POKEDEX/releases/download/pokedex-v21.1.0/pokedex.apk",
            "changelog": "POKEDEX v21.1.0 — Release otimizada, Android 17, National Dex completa, busca e coleção aprimoradas, testes ampliados e melhorias de performance.",
            "mandatory": false,
            "sha256": "$SHA256"
          }
          EOF
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pokedex-v21.1.0
          name: POKEDEX v21.1.0
          files: |
            release-apk/pokedex.apk
            release-apk/update.json
          body: "POKEDEX v21.1.0 — pacote de auditoria geral: build Release, Android 17/API 37, metadados completos da National Dex, UX e qualidade ampliadas. A chave de assinatura permanece inalterada nesta etapa."
      - name: Publish in-app manifest to main
        run: |
          cp release-apk/update.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: publish v21.1 update manifest [manifest-only]"
          git pull --rebase origin main
          git push origin HEAD:main
